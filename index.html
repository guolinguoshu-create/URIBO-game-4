<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uribo Chototsu Moshin!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #121212; font-family: 'Hiragino Kaku Gothic ProN', sans-serif; color: #fff; }
        
        /* 画面全体に収まるよう flex と height を厳密化 */
        #outer-container { width: 100vw; height: 100vh; max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; background: #1e1e24; padding: 6px; position: relative; }
        
        #game-header { width: 100%; height: 32px; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; color: #FFD700; flex-shrink: 0; }
        #game-header span { font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px #000; }
        #sound-toggle { font-size: 14px; background: #333; border: 1px solid #555; color: white; padding: 2px 8px; border-radius: 20px; cursor: pointer; }

        #canvas-wrapper { width: 100%; flex: 1; min-height: 0; position: relative; overflow: hidden; border-radius: 12px; border: 2px solid #444; background: #87CEEB; }
        canvas { width: 100%; height: 100%; display: block; }
        
        /* 下部ステータス表示：確実に画面内に固定 */
        #game-footer { width: 100%; height: 58px; background: #2a2a35; margin-top: 6px; border-radius: 10px; display: flex; justify-content: space-around; align-items: center; border: 1px solid #3d3d4e; flex-shrink: 0; }
        .stat-box { text-align: center; }
        .stat-label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 20px; font-weight: 900; color: #00E676; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .stat-value.high { color: #FFD700; }

        .ui-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.65); color: white; text-align: center; padding: 16px; z-index: 20; backdrop-filter: blur(2px); }
        h1 { font-size: 22px; margin-bottom: 4px; color: #FFD700; text-shadow: 2px 2px 6px #000; font-weight: 900; line-height: 1.2; }
        .catchphrase { font-size: 12px; color: #FFF; background: #FF5722; padding: 3px 12px; border-radius: 20px; margin-bottom: 12px; font-weight: bold; }
        
        input[type="text"] { width: 85%; padding: 8px 12px; font-size: 14px; border-radius: 20px; border: 2px solid #FF5722; background: #222; color: #fff; text-align: center; margin-bottom: 12px; outline: none; }
        
        button { padding: 10px 20px; font-size: 15px; font-weight: bold; background: #FF5722; color: white; border: none; border-radius: 25px; cursor: pointer; margin: 4px; box-shadow: 0 3px #BF360C; width: 80%; max-width: 200px; }
        button:active { transform: translateY(2px); box-shadow: 0 1px #BF360C; }

        .ranking-box { width: 95%; background: rgba(255,255,255,0.15); border-radius: 8px; padding: 6px; margin: 6px 0; font-size: 11px; text-align: left; }
        .ranking-title { font-weight: bold; color: #FFD700; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 2px; margin-bottom: 4px; text-align: center; }
        .ranking-item { display: flex; justify-content: space-between; padding: 2px 4px; }
        .ranking-item.me { background: rgba(255, 215, 0, 0.35); border-radius: 4px; font-weight: bold; color: #FFD700; }
    </style>
</head>
<body>

<div id="outer-container">
    <div id="game-header">
        <span>🌸 Uribo Chototsu Moshin!</span>
        <button id="sound-toggle">🔊</button>
    </div>

    <div id="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
        
        <!-- スタート画面 -->
        <div id="start-screen" class="ui-screen">
            <h1>Uribo Chototsu Moshin!</h1>
            <div class="catchphrase">Uribo shika katanuu!</div>
            <p style="margin-bottom:8px; font-size: 12px;">お名前を入力してスタート！</p>
            <input type="text" id="player-name-input" placeholder="名前を入力（例: ウリボ王）" maxlength="10">
            <button id="start-btn">ゲームスタート！</button>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameover-screen" class="ui-screen" style="display: none;">
            <h1 style="color:#FF5252;">💥 激突 GAMEOVER!!</h1>
            <p id="final-score-text" style="font-size: 15px; font-weight: bold; margin: 4px 0; color: #FFF;">走行距離: 0m</p>
            
            <div class="ranking-box">
                <div class="ranking-title">🏆 全国ランキング (TOP 5)</div>
                <div id="ranking-list"></div>
            </div>

            <button id="restart-btn">もう一度挑戦！</button>
        </div>
    </div>

    <!-- 下部：走行距離・自己ベスト表示エリア -->
    <div id="game-footer">
        <div class="stat-box">
            <div class="stat-label">現在の距離</div>
            <div class="stat-value" id="current-score-disp">0m</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">自己ベスト</div>
            <div class="stat-value high" id="high-score-disp">0m</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
resize();
window.addEventListener('resize', resize);

// 元画像からウリボだけをクロマキー（背景透過）処理で抽出
const sourceImg = new Image();
sourceImg.src = 'Screenshot_20260823-100724.png';

const uriboCanvas = document.createElement('canvas');
const uriboCtx = uriboCanvas.getContext('2d');
let uriboReady = false;

sourceImg.onload = () => {
    const sx = sourceImg.naturalWidth * 0.05;
    const sy = sourceImg.naturalHeight * 0.48;
    const sw = sourceImg.naturalWidth * 0.60;
    const sh = sourceImg.naturalHeight * 0.35;

    uriboCanvas.width = sw;
    uriboCanvas.height = sh;

    uriboCtx.drawImage(sourceImg, sx, sy, sw, sh, 0, 0, sw, sh);

    // 画像データの背景色を透過処理
    const imgData = uriboCtx.getImageData(0, 0, sw, sh);
    const data = imgData.data;

    for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        // 草・道・空の背景色（茶色いウリボ本体以外）を除去
        const isGreen = (g > 100 && r < 180 && b < 150);
        const isBlue = (b > 150 && r < 150);
        const isGroundPath = (r > 140 && g > 110 && b < 90 && (r - b > 60));

        if (isGreen || isBlue || isGroundPath) {
            data[i + 3] = 0; // 透明化
        }
    }

    uriboCtx.putImageData(imgData, 0, 0);
    uriboReady = true;
};

let audioCtx = null;
let isMuted = false;
let bgmTimer = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playJumpSound() {
    if (isMuted || !audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(250, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    } catch(e){}
}

function playCrashSound() {
    if (isMuted || !audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    } catch(e){}
}

const bgmMelody = [
    220.00, 220.00, 261.63, 220.00, 293.66, 220.00, 329.63, 261.63,
    220.00, 220.00, 261.63, 220.00, 246.94, 220.00, 207.65, 220.00
];
let bgmIndex = 0;

function startBGM() {
    if (bgmTimer) clearInterval(bgmTimer);
    bgmTimer = setInterval(() => {
        if (gameState === 'PLAYING' && !isMuted && audioCtx) {
            try {
                const freq = bgmMelody[bgmIndex % bgmMelody.length];
                bgmIndex++;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.11);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.11);
            } catch(e){}
        }
    }, 140);
}

document.getElementById('sound-toggle').addEventListener('click', (e) => {
    e.stopPropagation();
    isMuted = !isMuted;
    document.getElementById('sound-toggle').innerText = isMuted ? '🔇' : '🔊';
});

let gameState = 'START';
let score = 0;
let highScore = parseInt(localStorage.getItem('uribo_highscore') || '0');
let playerName = localStorage.getItem('uribo_playername') || '';
let gameSpeed = 5;
let bgScrollX = 0;

document.getElementById('high-score-disp').innerText = `${highScore}m`;
if (playerName) document.getElementById('player-name-input').value = playerName;

const player = {
    x: 40,
    y: 0,
    width: 70,
    height: 55,
    vy: 0,
    gravity: 0.65,
    jumpPower: -12.0,
    isGrounded: false
};

let obstacles = [];
let spawnTimer = 0;
let nextSpawnDelay = 50;

const obstacleTypes = [
    { type: 'rock', width: 34, height: 34 },
    { type: 'big_rock', width: 44, height: 44 },
    { type: 'mushroom', width: 30, height: 40 },
    { type: 'stump', width: 38, height: 32 }
];

function doJump() {
    if (gameState === 'PLAYING' && player.isGrounded) {
        player.vy = player.jumpPower;
        player.isGrounded = false;
        playJumpSound();
    }
}

document.getElementById('canvas-wrapper').addEventListener('touchstart', (e) => {
    if (gameState === 'PLAYING') {
        e.preventDefault();
        doJump();
    }
}, { passive: false });

document.getElementById('canvas-wrapper').addEventListener('mousedown', (e) => {
    if (gameState === 'PLAYING') {
        doJump();
    }
});

function updateRankings(currentScore, name) {
    let rankings = JSON.parse(localStorage.getItem('uribo_rankings') || '[]');
    rankings.push({ name: name, score: Math.floor(currentScore), date: new Date().toLocaleDateString() });
    
    rankings.sort((a, b) => b.score - a.score);
    rankings = rankings.slice(0, 5);
    localStorage.setItem('uribo_rankings', JSON.stringify(rankings));

    const listEl = document.getElementById('ranking-list');
    listEl.innerHTML = '';
    rankings.forEach((item, idx) => {
        const isMe = (item.name === name && item.score === Math.floor(currentScore));
        const div = document.createElement('div');
        div.className = `ranking-item ${isMe ? 'me' : ''}`;
        div.innerHTML = `<span>${idx + 1}位: ${item.name}</span><span>${item.score}m</span>`;
        listEl.appendChild(div);
    });
}

function startGame() {
    initAudio();
    const nameInput = document.getElementById('player-name-input').value.trim();
    playerName = nameInput || '名無しウリボ';
    localStorage.setItem('uribo_playername', playerName);

    score = 0;
    gameSpeed = 5;
    const groundY = canvas.height * 0.72;
    player.y = groundY - player.height;
    player.vy = 0;
    player.isGrounded = true;
    obstacles = [];
    spawnTimer = 0;
    nextSpawnDelay = Math.floor(Math.random() * 30) + 40;
    gameState = 'PLAYING';
    
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('gameover-screen').style.display = 'none';
    
    startBGM();
}

function update() {
    if (gameState !== 'PLAYING') return;

    score += 0.15;
    gameSpeed = 5 + (score / 50);
    const roundedScore = Math.floor(score);
    document.getElementById('current-score-disp').innerText = `${roundedScore}m`;

    if (roundedScore > highScore) {
        highScore = roundedScore;
        localStorage.setItem('uribo_highscore', highScore);
        document.getElementById('high-score-disp').innerText = `${highScore}m`;
    }

    bgScrollX = (bgScrollX + gameSpeed) % canvas.width;

    const groundY = canvas.height * 0.72;
    const floorY = groundY - player.height;

    player.vy += player.gravity;
    player.y += player.vy;

    if (player.y >= floorY) {
        player.y = floorY;
        player.vy = 0;
        player.isGrounded = true;
    }

    spawnTimer++;
    if (spawnTimer >= nextSpawnDelay) {
        const typeObj = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
        obstacles.push({
            x: canvas.width,
            y: groundY - typeObj.height + 2,
            width: typeObj.width,
            height: typeObj.height,
            type: typeObj.type
        });
        spawnTimer = 0;
        const minDelay = Math.max(30, 65 - Math.floor(gameSpeed * 2.5));
        nextSpawnDelay = Math.floor(Math.random() * 35) + minDelay;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;

        if (
            player.x + 8 < obs.x + obs.width &&
            player.x + player.width - 8 > obs.x &&
            player.y + 8 < obs.y + obs.height &&
            player.y + player.height > obs.y
        ) {
            gameState = 'GAMEOVER';
            playCrashSound();
            document.getElementById('final-score-text').innerText = `走行距離: ${roundedScore}m`;
            updateRankings(score, playerName);
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        if (obs.x + obs.width < 0) obstacles.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const groundY = canvas.height * 0.72;

    // 1. 空のグラデーション
    const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
    skyGrad.addColorStop(0, '#3a9bdc');
    skyGrad.addColorStop(0.7, '#83cceb');
    skyGrad.addColorStop(1, '#d0eeeb');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, groundY);

    // 2. 山々（背景スクロール）
    ctx.fillStyle = '#6ab875';
    for (let i = -1; i <= 2; i++) {
        let mx = i * (canvas.width * 0.8) - (bgScrollX * 0.2 % (canvas.width * 0.8));
        ctx.beginPath();
        ctx.moveTo(mx, groundY);
        ctx.quadraticCurveTo(mx + 100, groundY - 100, mx + 200, groundY);
        ctx.fill();
    }

    // 3. 地面（緑の草原）
    ctx.fillStyle = '#55a643';
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    // 4. 茶色の走る道
    ctx.fillStyle = '#9e7956';
    ctx.fillRect(0, groundY + 8, canvas.width, 28);

    // 5. 障害物
    obstacles.forEach(obs => {
        if (obs.type === 'rock' || obs.type === 'big_rock') {
            ctx.fillStyle = '#614839';
            ctx.beginPath();
            ctx.ellipse(obs.x + obs.width/2, obs.y + obs.height/2, obs.width/2, obs.height/2, 0, 0, Math.PI*2);
            ctx.fill();
        } else if (obs.type === 'mushroom') {
            ctx.fillStyle = '#fff8e1';
            ctx.fillRect(obs.x + obs.width*0.35, obs.y + obs.height*0.4, obs.width*0.3, obs.height*0.6);
            ctx.fillStyle = '#f44336';
            ctx.beginPath();
            ctx.arc(obs.x + obs.width/2, obs.y + obs.height*0.4, obs.width/2, Math.PI, 0);
            ctx.fill();
        } else if (obs.type === 'stump') {
            ctx.fillStyle = '#4e342e';
            ctx.fillRect(obs.x, obs.y + 4, obs.width, obs.height - 4);
        }
    });

    // 6. ウリボ本体（透過切り抜き版）
    if (uriboReady) {
        ctx.drawImage(uriboCanvas, player.x, player.y, player.width, player.height);
    } else {
        ctx.fillStyle = '#8d5524';
        ctx.beginPath();
        ctx.ellipse(player.x + player.width/2, player.y + player.height/2, player.width/2, player.height/2, 0, 0, Math.PI*2);
        ctx.fill();
    }

    // 7. 足元の煙エフェクト
    if (player.isGrounded && gameState === 'PLAYING') {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.beginPath();
        ctx.arc(player.x, groundY + 12, 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

document.getElementById('start-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    startGame();
});

document.getElementById('restart-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    startGame();
});

loop();
</script>
</body>
</html>
